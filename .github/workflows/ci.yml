name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: install
        run: python -m pip install -e ".[dev]"
      - name: lint
        run: ruff check src eval data tests scripts
      - name: generate corpus
        run: python data/generate_corpus.py
      - name: tests
        run: pytest -q
      - name: weight attestation (Paramesphere S0 - synthetic swap-test, no download)
        run: python scripts/attest_weights.py --demo
      - name: scribe OCR gate (S2 harness - stub backends, no download)
        run: python eval/run_scribe_eval.py
      - name: eval (fast - NetworkX backend, no rerank download)
        run: python eval/run_eval.py --fast
